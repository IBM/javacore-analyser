#
# Unit tests — runs on every pull request targeting main to verify
# that all tests pass before merging.

name: Unit tests

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # versioningit needs full history to resolve tags

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          cache: pip

      - name: Install dependencies
        # Install only the packages actually needed by the unit tests.
        # Heavy optional deps (torch, transformers, ibm-watsonx-ai) are not
        # required for the unit test suite and would slow the runner down.
        # requirements-test.txt is generated from requirements-test.in via (see requirements-test.in for full command):
        #   podman run --rm -v "$(pwd):/work" -w /work python:3.12-slim bash -c "pip install pip-tools --quiet && pip-compile --generate-hashes ..."
        run: pip install --require-hashes -r requirements-test.txt

      - name: Run unit tests
        run: PYTHONPATH=src:test python -m unittest discover
