#
# Unit tests — runs on every pull request targeting main to verify
# that all tests pass before merging.

name: Unit tests

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # versioningit needs full history to resolve tags

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        # Install only the packages actually needed by the unit tests.
        # Heavy optional deps (torch, transformers, ibm-watsonx-ai) are not
        # required for the unit test suite and would slow the runner down.
        run: |
          pip install \
            py7zr lxml pyana importlib-resources \
            tqdm haralyzer flask waitress markdown \
            numpy xgboost scikit-learn pandas \
            "idna>=3.15" "filelock>=3.20.3"

      - name: Run unit tests
        run: PYTHONPATH=src:test python -m unittest discover
