#
# Unit tests — runs on every pull request targeting main to verify
# that all tests pass before merging.

name: Unit tests

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0  # versioningit needs full history to resolve tags

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        # Install only the packages actually needed by the unit tests.
        # Heavy optional deps (torch, transformers, ibm-watsonx-ai) are not
        # required for the unit test suite and would slow the runner down.
        run: |
          pip install \
            py7zr lxml pyana importlib-resources \
            tqdm haralyzer flask waitress markdown \
            numpy xgboost scikit-learn pandas \
            "idna>=3.15" "filelock>=3.20.3"

      - name: Run unit tests
        run: PYTHONPATH=src:test python -m unittest discover
