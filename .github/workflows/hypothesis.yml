#
# Hypothesis property-based fuzzing — runs on every pull request and on the
# weekly schedule to catch parser crashes with generated adversarial inputs.
# No Docker, no LLVM, no special infrastructure required.

name: Hypothesis fuzzing

on:
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1'  # every Monday at 03:00 UTC

permissions:
  contents: read

jobs:
  hypothesis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install hypothesis ".[full]"

      - name: Run Hypothesis fuzz tests
        run: PYTHONPATH=src:test python -m unittest test.test_hypothesis_fuzz -v
