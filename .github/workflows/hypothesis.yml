#
# Hypothesis property-based fuzzing — runs on every pull request and on the
# weekly schedule to catch parser crashes with generated adversarial inputs.
# No Docker, no LLVM, no special infrastructure required.

name: Hypothesis fuzzing

on:
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1'  # every Monday at 03:00 UTC

permissions:
  contents: read

jobs:
  hypothesis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # versioningit needs full history to resolve tags

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
          cache: pip

      - name: Install dependencies
        # Install only the packages actually needed by the fuzz tests.
        # requirements.txt pulls in heavy optional deps (torch, transformers,
        # ibm-watsonx-ai) that are not required here and slow the runner down.
        run: |
          pip install hypothesis \
            py7zr lxml pyana importlib-resources tqdm haralyzer \
            numpy xgboost scikit-learn \
            "idna>=3.15" "filelock>=3.20.3"

      - name: Run Hypothesis fuzz tests
        run: PYTHONPATH=src:test python -m unittest test.test_hypothesis_fuzz -v
