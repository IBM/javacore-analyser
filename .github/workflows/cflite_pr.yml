# ClusterFuzzLite PR fuzzing — runs a short fuzz session on every pull request.
# See https://google.github.io/clusterfuzzlite/running-clusterfuzzlite/github-actions/

name: ClusterFuzzLite PR fuzzing

on:
  pull_request:
    branches: [ main ]

permissions:
  actions: write        # required for upload-build / download-build artifacts
  contents: read
  security-events: write  # required for upload-sarif

jobs:
  PR:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: python
          sanitizer: address
          bad-build-check: false
          keep-unaffected-fuzz-targets: true
          upload-build: true

      - name: Run Fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 60
          mode: code-change
          language: python
          sanitizer: address
          output-sarif: true
          storage-repo: https://github.com/${{ github.repository }}

      - name: Upload SARIF
        if: always() && hashFiles('clusterfuzz-sarif/results.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: clusterfuzz-sarif/results.sarif
