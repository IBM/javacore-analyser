# ClusterFuzzLite batch fuzzing — runs a longer fuzz session on the main branch
# on a weekly schedule and saves the corpus/crash artifacts.
# See https://google.github.io/clusterfuzzlite/running-clusterfuzzlite/github-actions/

name: ClusterFuzzLite batch fuzzing

on:
  schedule:
    - cron: '0 3 * * 1'  # every Monday at 03:00 UTC
  push:
    branches: [ main ]

permissions:
  contents: write         # required for upload-build to push to storage-repo branch
  security-events: write  # required for upload-sarif

jobs:
  BatchFuzzing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: python
          sanitizer: address
          bad-build-check: false
          upload-build: true

      - name: Run Fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: batch
          language: python
          sanitizer: address
          output-sarif: true
          storage-repo: https://github.com/${{ github.repository }}

      - name: Upload SARIF
        if: always() && hashFiles('clusterfuzz-sarif/results.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: clusterfuzz-sarif/results.sarif
