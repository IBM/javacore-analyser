<div class="cds--accordion__item" id="accordion-{section_id}">
    <button type="button" class="cds--accordion__heading"
            aria-expanded="false" aria-controls="content-{section_id}"
            onclick="this.closest('.cds--accordion__item').classList.toggle('cds--accordion__item--active'); this.setAttribute('aria-expanded', this.closest('.cds--accordion__item').classList.contains('cds--accordion__item--active')?'true':'false');">
        <svg class="cds--accordion__arrow" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M11 8L6 13 4.6 11.6 8.2 8 4.6 4.4 6 3z"/></svg>
        <span class="cds--accordion__title">{escaped_title}</span>
    </button>
    <div class="cds--accordion__wrapper"><div id="content-{section_id}" class="cds--accordion__content">
        <div class="cds--accordion cds--accordion--sm help-accordion">
            <div class="cds--accordion__item">
                <button type="button" class="cds--accordion__heading" aria-expanded="false" aria-controls="help-{section_id}"
                        onclick="this.closest('.cds--accordion__item').classList.toggle('cds--accordion__item--active'); this.setAttribute('aria-expanded', this.closest('.cds--accordion__item').classList.contains('cds--accordion__item--active')?'true':'false');">
                    <svg class="cds--accordion__arrow" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><path d="M11 8L6 13 4.6 11.6 8.2 8 4.6 4.4 6 3z"/></svg>
                    <span class="cds--accordion__title">What does this section tell me?</span>
                </button>
                <div class="cds--accordion__wrapper"><div id="help-{section_id}" class="cds--accordion__content">
                    {description}
                </div></div>
            </div>
        </div>
